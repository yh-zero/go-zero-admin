}
service User {
 rpc GetUserResourcePreview(UserResourcePreviewRequest) returns(UserResourcePreviewResponse);
 rpc TransferUserResources(TransferUserResourcesRequest) returns(TransferUserResourcesResponse);
  rpc CheckSession (SessionRequest) returns (CheckSessionResponse);
  rpc GetCurrentUser (SessionRequest) returns (GetUserInfoResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (NoDataResponse);
  rpc Logout (SessionRequest) returns (NoDataResponse);
  //  获取用户信息
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoResponse);
  // 获取Token
  rpc GetUserToke (GetUserTokeRequest) returns(GetUserTokeResponse);
  // 分页获取用户列表
  rpc GetUserList (GetUserListRequest) returns(GetUserListResponse);
  // 新增（注册）用户 - 管理员
  rpc Register (RegisterRequest) returns(RegisterResponse);
  // 修改用户信息
  rpc UpdateUserInfo (UpdateUserInfoRequest) returns(NoDataResponse);
  // 修改用户和角色的关系信息 -- 和上  在修改用户信息的时候请求
  rpc UpdateUserAuthorities (UpdateUserAuthoritiesRequest) returns(NoDataResponse);
  // 重置用户密码 默认密码：goZero
  rpc ResetUserPassword (ResetUserPasswordRequest) returns(NoDataResponse);
  // 删除用户
  rpc DeleteUser (DeleteUserRequest) returns(NoDataResponse);

}


service Menu {
 rpc PreviewMenuMove (PreviewMenuMoveRequest) returns (PreviewMenuMoveResponse);
  rpc GetAuthorityButtons (GetAuthorityButtonsRequest) returns (GetAuthorityButtonsResponse);
  rpc UpdateAuthorityButtons (UpdateAuthorityButtonsRequest) returns (NoDataResponse);
  // 获取菜单-路由
  rpc GetMenuTree (GetMenuTreeRequest) returns (GetMenuTreeResponse);
  // 获取系统基础菜单列表
  rpc GetMenuBaseInfoList (NoDataResponse) returns (GetMenuBaseInfoListResponse);
  // 添加系统基础菜单列表
  rpc AddMenuBase (AddMenuBaseRequest) returns (NoDataResponse);
  // 获取用户动态路由树  -- 用于角色管理的设置权限
  rpc GetBaseMenuTree (NoDataResponse) returns (GetBaseMenuTreeResponse);
  // 获取指定角色menu  -- 用于角色管理的设置权限
  rpc GetMenuAuthority (GetMenuAuthorityRequest) returns (GetMenuAuthorityResponse);
  // 根据id获取系统菜单
  rpc GetBaseMenuById (GetBaseMenuByIdRequest) returns (GetBaseMenuByIdResponse);
  // 更新系统菜单
  rpc UpdateBaseMenu (UpdateBaseMenuRequest) returns (NoDataResponse);
  // 删除系统菜单
  rpc DeleteBaseMenu (DeleteBaseMenuRequest) returns (NoDataResponse);

}


service Authority {
  // 获取角色列表
  rpc GetAuthorityList (GetAuthorityListRequest) returns (GetAuthorityListResponse);
  // 增加base_menu和角色关联关系 -- 用于角色管理的设置权限
  rpc AddAuthorityMenu (AddAuthorityMenuRequest) returns (NoDataResponse);
  // 更新角色 -- 设为首页
  rpc UpdateAuthority (UpdateAuthorityRequest) returns (UpdateAuthorityResponse);
  // 创建角色
  rpc CreateAuthority (CreateAuthorityRequest) returns (CreateAuthorityResponse);
  // 删除角色
  rpc DeleteAuthority (DeleteAuthorityRequest) returns (NoDataResponse);


}

service Api {
  // 预览当前Swagger与权限资源的差异
  rpc PreviewApiSync (NoDataResponse) returns (PreviewApiSyncResponse);
  // 按已确认的差异同步资源，不修改现有授权
  rpc ApplyApiSync (ApplyApiSyncRequest) returns (ApplyApiSyncResponse);
  // 获取API列表
  rpc GetApiList (GetApiListRequest) returns (GetApiListResponse);
  // 创建/添加 API列表
  rpc CreateApi (CreateApiRequest) returns (NoDataResponse);
  // 删除API列表
  rpc DeleteApi (DeleteApiRequest) returns (NoDataResponse);
  // 获取全部API列表
  rpc GetAllApiList (NoDataResponse) returns (GetAllApiListResponse);
  // 删除多条api
  rpc DeleteApisByIds (DeleteApisByIdsRequest) returns (NoDataResponse);
  // 更新api
  rpc UpdateApi (UpdateApiRequest) returns (NoDataResponse);

}

service Casbin {
  // 根据角色id获取对应的casbin数据
  rpc GetPathByAuthorityId (GetPathByAuthorityIdRequest) returns (GetPathByAuthorityIdResponse);
  // 更新一个角色的对应的casbin数据
  rpc UpdateCasbinData (UpdateCasbinDataRequest) returns (NoDataResponse);
  // 更新一个角色的对应的casbin数据 用api的ids 查数据
//  rpc UpdateCasbinDataByApiIds (UpdateCasbinDataByApiIdsRequest) returns (NoDataResponse);
  rpc UpdateCasbinDataByApiIds (UpdateCasbinDataByApiIdsRequest) returns (UpdateCasbinDataByApiIdsResponse);
  // casbin 鉴权 供api网关/中间件调用
  rpc Enforce (EnforceRequest) returns (EnforceResponse);

}

service Dictionary {
  // =================  SysDictionary ==============

  // 获取SysDictionary列表 -- all
  rpc GetSysDictionaryList (NoDataResponse) returns (DictionaryListResponse);
  // 新建SysDictionary
  rpc CreateSysDictionary (CreateSysDictionaryRequest) returns (NoDataResponse);
  // 根据ID或者type获取SysDictionary
  rpc GetSysDictionaryDetails (GetSysDictionaryDetailsRequest) returns (GetSysDictionaryDetailsResponse);
  // 更新SysDictionary
  rpc UpdateSysDictionary (UpdateSysDictionaryRequest) returns (NoDataResponse);
  // 更新SysDictionary
  rpc DeleteSysDictionary (DeleteSysDictionaryRequest) returns (NoDataResponse);

  // =================  SysDictionaryInfo ==============

  // 获取SysDictionaryInfo列表 -- 分页带搜索
  rpc GetSysDictionaryInfoList (GetSysDictionaryInfoListRequest) returns (GetSysDictionaryInfoListResponse);
  // 根据id获取SysDictionaryInfo详情
  rpc GetSysDictionaryInfoListDetailsById (GetSysDictionaryInfoListDetailsByIdRequest) returns (GetSysDictionaryInfoListDetailsByIdResponse);
  // 更新SysDictionaryInfo
  rpc UpdateSysDictionaryInfo (UpdateSysDictionaryInfoRequest) returns (NoDataResponse);
  // 创建SysDictionaryInfo
  rpc CreateSysDictionaryInfo (CreateSysDictionaryInfoRequest) returns (NoDataResponse);
  // 删除SysDictionaryInfo
  rpc DeleteSysDictionaryInfo (DeleteSysDictionaryInfoRequest) returns (NoDataResponse);
}

message ApiSyncItem {
  string key = 1;
  int64 id = 2;
  string path = 3;
  string method = 4;
  string apiGroup = 5;
  string description = 6;
  string currentApiGroup = 7;
  string currentDescription = 8;
}
message PreviewApiSyncResponse {
  string version = 1;
  repeated ApiSyncItem added = 2;
  repeated ApiSyncItem changed = 3;
  repeated ApiSyncItem obsolete = 4;
}
message ApplyApiSyncRequest {
  string version = 1;
  repeated string keys = 2;
}
message ApplyApiSyncResponse {
  int64 added = 1;
  int64 updated = 2;
}

message AuditLog {
  int64 ID = 1;
  int64 ActorID = 2;
  string ActorName = 3;
  int64 AuthorityId = 4;
  string Module = 5;
  string Action = 6;
  string Object = 7;
  string Path = 8;
  string Method = 9;
  string Result = 10;
  int64 StatusCode = 11;
  string IP = 12;
  string TraceID = 13;
  int64 DurationMs = 14;
  string Params = 15;
  string CreatedAt = 16;
  string EventType = 17;
}
message RecordAuditRequest { AuditLog Log = 1; }
message GetAuditLogListRequest {
  PageRequest PageRequest = 1;
  string EventType = 2;
  string Module = 3;
  int64 ActorID = 4;
  string ActorName = 5;
  string Result = 6;
  string StartTime = 7;
  string EndTime = 8;
}
message GetAuditLogListResponse { repeated AuditLog List = 1; int64 Total = 2; }
service Audit {
  rpc RecordAudit (RecordAuditRequest) returns (NoDataResponse);
  rpc GetAuditLogList (GetAuditLogListRequest) returns (GetAuditLogListResponse);
}

message Department {
  int64 ID = 1;
  int64 ParentId = 2;
  string Name = 3;
  string Code = 4;
  int64 Sort = 5;
  int64 Status = 6;
  string Leader = 7;
  repeated Department Children = 8;
}
message Position { int64 ID = 1; string Name = 2; string Code = 3; int64 Sort = 4; int64 Status = 5; }
message DepartmentRequest { Department Department = 1; }
message PositionRequest { Position Position = 1; }
message OrganizationIDRequest { int64 ID = 1; }
message OrganizationListRequest { string Keyword = 1; int64 Status = 2; }
message DepartmentListResponse { repeated Department List = 1; }
message PositionListResponse { repeated Position List = 1; }
message MembershipRequest { int64 UserID = 1; int64 DepartmentId = 2; repeated int64 PositionIds = 3; }
message MembershipResponse { int64 UserID = 1; int64 DepartmentId = 2; repeated int64 PositionIds = 3; }
message RoleDataScope { string Revision = 4; string ExpectedRevision = 5; int64 AuthorityId = 1; string Scope = 2; repeated int64 DepartmentIds = 3; }
message RoleDataScopeRequest { RoleDataScope DataScope = 1; }
message GetRoleDataScopeRequest { int64 AuthorityId = 1; }
message RoleDataScopeResponse { RoleDataScope DataScope = 1; }
service Organization {
  rpc GetDepartmentTree (OrganizationListRequest) returns (DepartmentListResponse);
  rpc CreateDepartment (DepartmentRequest) returns (Department);
  rpc UpdateDepartment (DepartmentRequest) returns (NoDataResponse);
  rpc DeleteDepartment (OrganizationIDRequest) returns (NoDataResponse);
  rpc GetPositionList (OrganizationListRequest) returns (PositionListResponse);
  rpc CreatePosition (PositionRequest) returns (Position);
  rpc UpdatePosition (PositionRequest) returns (NoDataResponse);
  rpc DeletePosition (OrganizationIDRequest) returns (NoDataResponse);
  rpc GetMembership (OrganizationIDRequest) returns (MembershipResponse);
  rpc UpdateMembership (MembershipRequest) returns (NoDataResponse);
  rpc GetRoleDataScope (GetRoleDataScopeRequest) returns (RoleDataScopeResponse);
  rpc UpdateRoleDataScope (RoleDataScopeRequest) returns (NoDataResponse);
}

message FileResource {
  int64 ID = 1;
  string ObjectKey = 2;
  string Name = 3;
  string Mime = 4;
  int64 Size = 5;
  int64 OwnerID = 6;
  int64 DepartmentId = 7;
  string Visibility = 8;
  string Status = 9;
  int64 References = 10;
  string CreatedAt = 11;
}
message RegisterFileRequest { SessionRequest Actor = 1; FileResource File = 2; }
message FileIDRequest { SessionRequest Actor = 1; int64 ID = 2; }
message FileListRequest { SessionRequest Actor = 1; PageRequest PageRequest = 2; string Name = 3; string Status = 4; }
message FileListResponse { repeated FileResource List = 1; int64 Total = 2; }
message FileReferenceRequest { SessionRequest Actor = 1; int64 FileID = 2; string ObjectType = 3; string ObjectID = 4; }
service FileResourceService {
  rpc RegisterFile (RegisterFileRequest) returns (FileResource);
  rpc GetFileList (FileListRequest) returns (FileListResponse);
  rpc GetFile (FileIDRequest) returns (FileResource);
  rpc AddFileReference (FileReferenceRequest) returns (NoDataResponse);
  rpc RemoveFileReference (FileReferenceRequest) returns (NoDataResponse);
  rpc BeginDeleteFile (FileIDRequest) returns (FileResource);
  rpc FinishDeleteFile (FileIDRequest) returns (NoDataResponse);
  // UploadFile stores the bytes in object storage (credentials live only in this RPC) and
  // registers the metadata in a single call. The Data field is bounded to 10MB.
  rpc UploadFile (UploadFileRequest) returns (UploadFileResponse);
  // GetFileURL returns a public URL for public files, or a 5-minute signed
  // URL for private files.
  rpc GetFileURL (FileIDRequest) returns (FileURLResponse);
  // DeleteFile is the one-shot orchestration: begin -> object storage delete -> finish.
  // It is safe to retry; already-deleted resources short-circuit.
  rpc DeleteFile (FileIDRequest) returns (NoDataResponse);
}

message UploadFileRequest {
  SessionRequest Actor = 1;
  bytes Data = 2;
  string Mime = 3;
  string Filename = 4;
  string Visibility = 5; // "public" | "private"
}
message UploadFileResponse {
  FileResource File = 1;
  string Url = 2;
  int64 ExpiresIn = 3; // 0 for public, 300 for private signed URL
}
message FileURLResponse {
  string Url = 1;
  int64 ExpiresIn = 2;
}

message DeviceSession {
  string ID = 1;
  int64 UserID = 2;
  string Username = 3;
  string IP = 4;
  string UserAgent = 5;
  string CreatedAt = 6;
  string ExpiresAt = 7;
  bool Current = 8;
}
message DeviceSessionListRequest { SessionRequest Actor = 1; PageRequest PageRequest = 2; int64 UserID = 3; }
message DeviceSessionListResponse { repeated DeviceSession List = 1; int64 Total = 2; }
message RevokeDeviceSessionRequest { SessionRequest Actor = 1; string ID = 2; bool SelfOnly = 3; }
service SessionManage {
  rpc GetDeviceSessions (DeviceSessionListRequest) returns (DeviceSessionListResponse);
  rpc RevokeDeviceSession (RevokeDeviceSessionRequest) returns (NoDataResponse);
}

// Business tools are internal RPC only and validate Actor on every call.
message AgentToolRequest { SessionRequest Actor = 1; string ArgumentsJson = 2; }
message AgentToolResult { string Content = 1; string Summary = 2; int64 Count = 3; }
service AgentTools {
  rpc QueryAgentAudit (AgentToolRequest) returns (AgentToolResult);
  rpc GetAgentFileStatus (AgentToolRequest) returns (AgentToolResult);
  rpc ListAgentDevices (AgentToolRequest) returns (AgentToolResult);
}

message PreviewMenuMoveRequest { int64 ID = 1; int64 ParentId = 2; }
message PermissionMenuLink { int64 AuthorityId = 1; int64 MenuId = 2; }
message PreviewMenuMoveResponse { string Version = 1; repeated int64 AuthorityIds = 2; repeated int64 AncestorIds = 3; repeated PermissionMenuLink AddedLinks = 4; }
message GetPermissionEditRequest { int64 AuthorityId = 1; string Kind = 2; }
message GetPermissionEditResponse { string Revision = 1; int64 AuthorityId = 2; string Kind = 3; repeated SysBaseMenu Menus = 4; repeated SysApi Apis = 5; repeated Department Departments = 6; repeated int64 MenuIds = 7; repeated int64 MenuBtnIds = 8; repeated CasbinInfo Policies = 9; RoleDataScope DataScope = 10; }
message GetPermissionSnapshotRequest { SessionRequest Actor = 1; }
message GetPermissionSnapshotResponse { string Revision = 1; string Fingerprint = 2; int64 AuthorityId = 3; string DefaultRouter = 4; repeated SysMenu Menus = 5; repeated string Codes = 6; }
message PermissionGrantSet { repeated int64 MenuIds = 1; repeated int64 MenuBtnIds = 2; repeated CasbinInfo Policies = 3; RoleDataScope DataScope = 4; }
message PermissionChange { int64 ID = 1; int64 AuthorityId = 2; string Kind = 3; string BeforeRevision = 4; string AfterRevision = 5; PermissionGrantSet Before = 6; PermissionGrantSet After = 7; int64 ActorId = 8; string ActorName = 9; string TraceId = 10; string CreatedAt = 11; }
message GetPermissionHistoryRequest { int64 AuthorityId = 1; string Kind = 2; PageRequest PageRequest = 3; }
message GetPermissionHistoryResponse { repeated PermissionChange List = 1; int64 Total = 2; }
message PreviewPermissionRollbackRequest { int64 ID = 1; }
message PreviewPermissionRollbackResponse { string Version = 1; PermissionChange Change = 2; bool Allowed = 3; string Reason = 4; }
message ApplyPermissionRollbackRequest { int64 ID = 1; string ExpectedRevision = 2; string Version = 3; }
service Permission {
 rpc GetPermissionEdit (GetPermissionEditRequest) returns (GetPermissionEditResponse);
 rpc GetPermissionSnapshot (GetPermissionSnapshotRequest) returns (GetPermissionSnapshotResponse);
 rpc GetPermissionHistory (GetPermissionHistoryRequest) returns (GetPermissionHistoryResponse);
 rpc PreviewPermissionRollback (PreviewPermissionRollbackRequest) returns (PreviewPermissionRollbackResponse);
 rpc ApplyPermissionRollback (ApplyPermissionRollbackRequest) returns (NoDataResponse);
}

// Mail owns the SMTP credentials and Redis cooldown/limit keys. Callers must
// supply the originating IP for rate limiting; the scene distinguishes
// register / reset_password / etc so the same email can hold independent codes.
message SendEmailCodeRequest {
  string Email = 1;
  bool IsForce = 2;
  string Scene = 3; // "register" | "reset_password" | ...
  string ClientIP = 4; // for per-IP rate limiting
}
message VerifyEmailCodeRequest {
  string Email = 1;
  string Code = 2;
  string Scene = 3;
}
message VerifyEmailCodeResponse {
  bool Matched = 1;
}
service Mail {
  rpc SendEmailCode (SendEmailCodeRequest) returns (NoDataResponse);
  rpc VerifyEmailCode (VerifyEmailCodeRequest) returns (VerifyEmailCodeResponse);
}

// Captcha owns the image-captcha Redis schema (key prefix, TTL, image
// dimensions, rate limits). Callers ask for a fresh image and later
// atomically consume it; both are server-side so the API tier never holds a
// Redis handle.
message GenerateImageResponse {
  string Id = 1;     // opaque captcha id; 10-128 chars [A-Za-z0-9_-]
  string Image = 2;  // base64 PNG, ready to drop into an <img> src
}
message VerifyCaptchaRequest {
  string Id = 1;
  string Answer = 2;
}
message VerifyCaptchaResponse {
  bool Matched = 1;
}
service Captcha {
  rpc GenerateImage (NoDataResponse) returns (GenerateImageResponse);
  rpc VerifyCaptcha (VerifyCaptchaRequest) returns (VerifyCaptchaResponse);
}

message UserResourcePreviewRequest { SessionRequest Actor = 1; int64 UserID = 2; }
message UserResourcePreviewResponse { int64 UserID = 1; string Username = 2; int64 Files = 3; int64 AIConversations = 4; int64 AIMessages = 5; int64 AIRuns = 6; bool AIAvailable = 7; string AIReason = 8; string TransferMode = 9; }
message TransferUserResourcesRequest { SessionRequest Actor = 1; int64 UserID = 2; int64 TargetUserID = 3; bool IncludeFiles = 4; bool IncludeAI = 5; }
message TransferUserResourcesResponse { int64 Files = 1; int64 AIConversations = 2; int64 AIMessages = 3; int64 AIRuns = 4; string TransactionMode = 5; }
