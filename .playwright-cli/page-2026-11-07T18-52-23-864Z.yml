                    - row [ref=e414]:
                      - cell "AI / 租户接口" [ref=e415]
                      - cell "AI 会话、工作流、任务审批，以及租户生命周期 HTTP/RPC 接口" [ref=e416]
                - paragraph [ref=e417]: APP 端另有独立的认证、资料、会员和反馈接口。租户运行栈需另行创建和配置；初始化库不附带虚构的运行栈或租户凭据。
                - generic [ref=e418]:
                  - heading "快速开始" [level=2] [ref=e419]
                  - 'link "Permalink: 快速开始" [ref=e420] [cursor=pointer]':
                    - /url: "#快速开始"
                - paragraph [ref=e423]:
                  - text: 准备
                  - strong [ref=e424]: Go 1.27.3、PowerShell、Docker（Linux 容器）及 Compose、Node.js 24、pnpm 11.28.5
                  - text: 。
                - paragraph [ref=e425]: 在仓库根目录打开 PowerShell，启动后端：
                - generic [ref=e426]:
                  - generic [ref=e427]:
                    - text: "cd go-zero-admin if (-not (Test-Path -LiteralPath .env.local)) { Copy-Item .env.local.example .env.local }"
                    - generic [ref=e428]: "# 按需编辑 .env.local，填写 AI Key 或 SMTP 邮箱及授权码"
                    - text: powershell -NoProfile -ExecutionPolicy Bypass -File .\data\scripts\build-images.ps1 docker compose --env-file .env.local up -d --build --wait
                  - button "Copy code to clipboard" [ref=e430] [cursor=pointer]
                - paragraph [ref=e434]: Dockerfile 使用宿主机预编译的 Linux 二进制；首次运行或修改后端代码后，先执行构建脚本。基础镜像需可拉取或已缓存。
                - paragraph [ref=e435]: 另开终端，从仓库根目录启动前端：
                - generic [ref=e436]:
                  - generic [ref=e437]: cd go-zero-admin-react pnpm install --frozen-lockfile pnpm dev
                  - button "Copy code to clipboard" [ref=e439] [cursor=pointer]
                - paragraph [ref=e443]:
                  - text: 访问
                  - link "http://127.0.0.1:5999" [ref=e444] [cursor=pointer]:
                    - /url: http://127.0.0.1:5999
                  - text: ，演示管理员：
                  - code [ref=e445]: admin / Admin@123456
                  - text: 。默认开启图片验证码，前端请求代理到 API 的
                  - code [ref=e446]: "7001"
                  - text: 端口。
                - paragraph [ref=e447]:
                  - text: 权限演示账号：
                  - code [ref=e448]: demo_all
                  - text: 、
                  - code [ref=e449]: demo_tree
                  - text: 、
                  - code [ref=e450]: demo_dept
                  - text: 、
                  - code [ref=e451]: demo_self
                  - text: ，分别查看全部、本部门及下级、本部门、本人数据，密码同上；
                  - code [ref=e452]: demo_tree
                  - text: 可切换部门比较范围。APP 示例账号为
                  - code [ref=e453]: alice@example.test
                  - text: ，密码同上。演示凭据仅限本地开发。
                - list [ref=e454]:
                  - listitem [ref=e455]:
                    - strong [ref=e456]: 初始化数据
                    - text: ：
                    - link "mysql-all.sql" [ref=e457] [cursor=pointer]:
