                      - cell "工作台" [ref=e400]
                      - cell "当前部门与授权范围内的统计、最近操作和常用入口" [ref=e401]
                    - row [ref=e402]:
                      - cell "系统管理" [ref=e403]
                      - cell "用户、角色、菜单、部门、字典、API 资源、文件、审计和个人中心" [ref=e404]
