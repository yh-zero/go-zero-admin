                    - row [ref=e408]:
                      - cell "APP管理" [ref=e409]
                      - cell "用户资料与审核、头像、登录设备、会员开通/撤销和反馈回复" [ref=e410]
                    - row [ref=e411]:
                      - cell "租户管理" [ref=e412]
