                    - text: 包含完整表结构与可公开的演示数据。MySQL 空数据卷首次启动自动导入；已有数据卷不会自动覆盖或更新。
                  - listitem [ref=e451]:
                    - strong [ref=e452]: 可选配置
                    - text: ：AI 和邮件不影响基础后台启动，配置项见
                    - link ".env.local.example" [ref=e453] [cursor=pointer]:
