                    - img "CI" [ref=e373]
                - paragraph [ref=e374]:
                  - text: 基于
                  - strong [ref=e375]: go-zero + React
                  - text: 的管理后台，包含权限、部门、文件、审计和 APP 用户管理，适合作为业务系统的开发起点。
                - paragraph [ref=e376]:
                  - text: 后端采用
                  - strong [ref=e377]: 1 个 HTTP API + 5 个 RPC 服务
                  - text: （admin / app / file / ai / tenant），前端采用 React 19、TypeScript 和 Ant Design 6。
                - paragraph [ref=e378]:
                  - text: CI 在推送代码、提交 PR 或手动触发时，自动执行后端
                  - code [ref=e379]: verify.ps1
                  - text: 、前端类型检查与构建；结果见上方状态标识或仓库 Actions 页面。
                - generic [ref=e380]:
                  - heading "功能" [level=2] [ref=e381]
                  - 'link "Permalink: 功能" [ref=e382] [cursor=pointer]':
                    - /url: "#功能"
