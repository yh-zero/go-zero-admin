                    - row [ref=e407]:
                      - cell "AI / 租户接口" [ref=e408]
                      - cell "AI 会话、工作流、任务审批，以及租户生命周期 HTTP/RPC 接口" [ref=e409]
                - paragraph [ref=e410]: APP 端另有独立的认证、资料、会员和反馈接口。租户运行栈需另行创建和配置；初始化库不附带虚构的运行栈或租户凭据。
                - generic [ref=e411]:
                  - heading "快速开始" [level=2] [ref=e412]
