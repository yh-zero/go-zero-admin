                - paragraph [ref=e416]:
                  - text: 准备
                  - strong [ref=e417]: Go 1.27.3、PowerShell、Docker（Linux 容器）及 Compose、Node.js 24、pnpm 11.28.5
                  - text: 。
                - paragraph [ref=e418]: 在仓库根目录打开 PowerShell，启动后端：
                - generic [ref=e419]:
                  - generic [ref=e420]:
                    - text: "cd go-zero-admin if (-not (Test-Path -LiteralPath .env.local)) { Copy-Item .env.local.example .env.local }"
                    - generic [ref=e421]: "# 按需编辑 .env.local，填写 AI Key 或 SMTP 邮箱及授权码"
                    - text: powershell -NoProfile -ExecutionPolicy Bypass -File .\data\scripts\build-images.ps1 docker compose --env-file .env.local up -d --build --wait
                  - button "Copy code to clipboard" [ref=e423] [cursor=pointer]
                - paragraph [ref=e427]: Dockerfile 使用宿主机预编译的 Linux 二进制；首次运行或修改后端代码后，先执行构建脚本。基础镜像需可拉取或已缓存。
                - paragraph [ref=e428]: 另开终端，从仓库根目录启动前端：
                - generic [ref=e429]:
                  - generic [ref=e430]: cd go-zero-admin-react pnpm install --frozen-lockfile pnpm dev
                  - button "Copy code to clipboard" [ref=e432] [cursor=pointer]
                - paragraph [ref=e436]:
                  - text: 访问
                  - link "http://127.0.0.1:5999" [ref=e437] [cursor=pointer]:
                    - /url: http://127.0.0.1:5999
                  - text: ，演示管理员：
                  - code [ref=e438]: admin / Admin@123456
                  - text: 。默认开启图片验证码，前端请求代理到 API 的
                  - code [ref=e439]: "7001"
                  - text: 端口。
                - paragraph [ref=e440]:
                  - text: 权限演示账号：
                  - code [ref=e441]: demo_all
                  - text: 、
                  - code [ref=e442]: demo_tree
                  - text: 、
                  - code [ref=e443]: demo_dept
                  - text: 、
                  - code [ref=e444]: demo_self
                  - text: ，分别查看全部、本部门及下级、本部门、本人数据，密码同上；
                  - code [ref=e445]: demo_tree
                  - text: 可切换部门比较范围。APP 示例账号为
                  - code [ref=e446]: alice@example.test
                  - text: ，密码同上。演示凭据仅限本地开发。
                - list [ref=e447]:
