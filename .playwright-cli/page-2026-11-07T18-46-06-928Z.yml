            - paragraph [ref=e553]: 基于 go-zero + React 19 + Ant Design 6 的开源全栈微服务管理后台，采用单仓库、1 API + 5 RPC 架构。支持 RBAC + Casbin 接口权限与部门级数据范围、每租户独立容器栈与数据库、Nginx 子域名路由；集成 Eino AI Agent、工具调用与人工审批工作流。采用 goctl 代码生成和缓存 Model 数据层，提供完整初始化数据，适合作为企业管理后台与 SaaS 项目的开发起点。
