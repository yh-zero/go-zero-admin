                              - link "打开当前原文" [ref=f2e417] [cursor=pointer]:
                                - /url: /ai/knowledge/5?doc_id=19
                              - paragraph [ref=f2e418]: "## 2. 构建、启动与就绪检查 新建或重置数据库先看[数据初始化](#数据初始化)；常规代码部署不重复导入 SQL 或删除数据卷。 ### Compose（日常默认） [Dockerfile](../go-zero-admin/docker/Dockerfile)只复制宿主预编译的 Linux 二进制，`docker compose --build` **不会编译 Go 源码**。首次运行或后端代码变更后，先执行[构建入口](../go-zero-admin/data/scripts/build-images.ps1)；构建失败立即停止，不部署旧产物。 ```powershell # 终端 A：从仓库根目录执行 cd go-zero-admin powershell -NoProfile -ExecutionPolicy Bypass -File ./data/scripts/build-images.ps1 if ($LASTEXITCODE -ne 0) { throw \"后端编译失败，停止部署\" } docker compose up -d --build --wait"
                              - group [ref=f2e419]:
                                - generic "查看来源标识" [ref=f2e420] [cursor=pointer]
                            - listitem [ref=f2e421]:
                              - strong [ref=f2e422]: 数据初始化与备份
                              - text: ·
                              - link "打开当前原文" [ref=f2e423] [cursor=pointer]:
                                - /url: /ai/knowledge/5?doc_id=18
                              - paragraph [ref=f2e424]: "n-rpc` 应用验证码配置；其他服务按各自启动流程处理，后端代码改变仍须先编译并构建对应镜像。通过 `/v1/sys/auth/captcha` 核对 `enabled=false` 且图片、ID 为空，再用有效测试账号正常登录。两个 `*.local.yaml` 文件均被忽略，不提交；远程/生产/租户启动不使用这个本地覆盖文件。验证码专项验收改用标准配置并核对 `enabled=true`。 开源初始化的演示管理员为 `admin / Admin@123456`，属于可公开的开发默认凭据，可以写入规范和文档。AI 可直接核对本地开发库与完整初始化 SQL 后正常登录，无需重复索要这些演示凭据。若 README 的本地改动与 SQL 不一致，以实际初始化来源和运行库核对结果为准，保留用户既有文档改动；此流程不授权改密、重置账号或公开真实凭据、AI Key、会话令牌。 ### 数据库备份 - 备份默认保留运行库的完整原始 SQL，不擅自删行、改值、脱敏或加密；历史备份不覆盖，初始化来源 `mysql-all.sql` 不作为运行库备份替代物。 - 先核对实际运行库和容器/连接来源"
                              - group [ref=f2e425]:
                                - generic "查看来源标识" [ref=f2e426] [cursor=pointer]
