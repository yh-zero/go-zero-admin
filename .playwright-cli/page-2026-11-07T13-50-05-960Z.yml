                              - text: ·
                              - link "打开当前原文" [ref=f2e405] [cursor=pointer]:
                                - /url: /ai/knowledge/5?doc_id=18
                              - paragraph [ref=f2e406]: "### 数据初始化 **初始化 SQL 会 DROP 并重建业务表，不是已有库的升级脚本。** 唯一入口为 [mysql-all.sql](../go-zero-admin/data/db/init/mysql-all.sql)： - 新建开发库：完整导入；Compose 的 MySQL 空数据卷首次启动自动导入，已有卷不自动覆盖或更新结构。 - 已有库改结构：先核对目标与数据处理方案；生成 model 时使用已导入完整 SQL 的新开发库，不为生成代码清空业务库。 - 重置已有库：须明确授权、确认目标并备份；不能把重跑初始化或删除数据卷当作通用排障手段。 - 演示账号与默认凭据见[快速开始](../README.md#快速开始)，仅限开发、部署前必须替换；后台图形验证码由 admin-rpc 的 `Captcha.Enabled` 控制。 ### AI 本地开发免图形验证码 AI 在本机开发、联调和功能验收启动时，默认使用忽略的本地覆盖配置关闭图形验证码，账号密码和会话/权限仍正常校验。将 `docker/etc/admin-rpc.yaml` 复制为 `docker/etc/"
                              - group [ref=f2e407]:
                                - generic "查看来源标识" [ref=f2e408] [cursor=pointer]
                            - listitem [ref=f2e409]:
                              - strong [ref=f2e410]: 数据初始化与备份
                              - text: ·
                              - link "打开当前原文" [ref=f2e411] [cursor=pointer]:
                                - /url: /ai/knowledge/5?doc_id=18
                              - paragraph [ref=f2e412]: "来源 `mysql-all.sql` 不作为运行库备份替代物。 - 先核对实际运行库和容器/连接来源，使用一致性快照导出，记录来源、导出时间与文件校验值；在独立环境恢复验证，不导回现有业务库，也不启动会调用外部服务的业务进程。 - 真实邮箱与 AI Key 不提交；不含这两类数据及根规范禁止公开信息的明文备份，按用户指定路径和分支直接提交，日期快照沿用后端 `data/db/init/YYYYMMDD/`。公开提交仍遵守根规范安全基线；受阻的完整原件保存在被忽略的本地目录，不擅自生成脱敏或加密替代文件。 - 分别说明“导出完成”“恢复验证通过”“本地提交完成”“远程推送完成”，不能用其中一项代替其余状态。"
                              - group [ref=f2e413]:
                                - generic "查看来源标识" [ref=f2e414] [cursor=pointer]
                            - listitem [ref=f2e415]:
