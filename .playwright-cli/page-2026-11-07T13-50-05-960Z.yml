                              - paragraph [ref=f2e430]: "## 1. 开发环境与配置 首次准备与工具版本见[快速开始](../README.md#快速开始)，以依赖声明、锁文件和实际工具版本为准；Docker 使用 Linux 容器模式，基础镜像须可拉取或已缓存。标准拓扑以 [Compose](../go-zero-admin/docker-compose.yml) 为准： | 服务 | 宿主访问地址 | 容器网络 / 用途 | |---|---|---| | MySQL | `127.0.0.1:3307` | `mysql:3306`，业务库 `gozero_admin` | | Redis | `127.0.0.1:16379` | `redis:6379`，缓存、会话与策略通知 | | RustFS | `127.0.0.1:19000`，控制台 `:19001` | `rustfs:9000`，S3 兼容存储 | | admin-api | `127.0.0.1:7001` | `platform-api:7001`，前端代理目标 | | admin/app/file/ai/tenant RPC | 默认不映射宿主端口 | 各服"
