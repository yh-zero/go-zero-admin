name: go-zero-admin

# 本机开发依赖，无需环境文件；服务器请使用 docker/deploy-compose.yml。
services:
  mysql:
    image: mysql:8.0.34
    container_name: gozero-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "goZero-admin"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/db/gozero-admin-20240129.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gozero-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    ports:
      - "127.0.0.1:2379:2379"
    image: quay.io/coreos/etcd:v3.5.11
    container_name: gozero-etcd
    restart: unless-stopped
    environment:
      ETCD_NAME: "default"
      ETCD_DATA_DIR: "/etcd-data"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_CLUSTER: "default=http://0.0.0.0:2380"
      ETCD_INITIAL_CLUSTER_TOKEN: "etcd-cluster"
      ETCD_INITIAL_CLUSTER_STATE: "new"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  swagger-ui:
    container_name: gozero-swagger
    image: swaggerapi/swagger-ui:v5.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWAGGER_API_URL: "http://host.docker.internal:7001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/api/generated:/spec:ro
      - ./docker/swagger/default.conf.template:/etc/swagger/default.conf.template:ro
      - ./docker/swagger/swagger-initializer.js:/etc/swagger/swagger-initializer.js:ro
    # Use the official UI assets and Nginx with our same-origin API proxy.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        envsubst '$$SWAGGER_API_URL' < /etc/swagger/default.conf.template > /etc/nginx/conf.d/default.conf
        cp /etc/swagger/swagger-initializer.js /usr/share/nginx/html/swagger-initializer.js
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/swagger.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
