Name: tenant-rpc
ListenOn: 0.0.0.0:6005
Timeout: 120000

# 租户登记表（gozero_admin 单库）
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node

# 租户 provisioning 配置
Tenant:
  StateDir: docker/tenant-stack/state
  InitSQLPath: data/db/init/mysql-all.sql
  StorageConfigPath: docker/etc/file-rpc.yaml
  NginxContainer: gozero-platform-nginx-1
  StackTemplateDir: docker/tenant-stack     # 租户栈模板目录（相对仓库根）
  NginxConfDir: docker/nginx/conf.d         # Nginx server 块输出目录
  EdgeNetwork: gozero-edge                  # 共享 docker 网络
  DomainSuffix: localhost                   # 子域名后缀（本地 *.localhost，生产 *.example.com）
