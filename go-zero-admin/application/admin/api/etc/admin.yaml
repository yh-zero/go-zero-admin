Name: admin-api
Host: 0.0.0.0
Port: 7001

AdminRpc:
  Endpoints:
    - 127.0.0.1:6001

FileRpc:
  Endpoints:
    - 127.0.0.1:6003
  Timeout: 40000

# 宿主开发默认不信任来源头；经反代访问时填写明确的代理 IP/CIDR。
TrustedProxies: []

Redis:
  Host: 127.0.0.1:16379
  Type: node

TenantRpc:
  Endpoints:
    - 127.0.0.1:6005
  Timeout: 120000

AppRpc:
  Endpoints:
    - 127.0.0.1:6002
  NonBlock: true
  Timeout: 15000

AiRpc:
  Endpoints:
    - 127.0.0.1:6004
  NonBlock: true
  Timeout: 120000

Auth:
  AccessSecret: go-zero-admin-local-development-jwt-secret
  AccessExpire: 7200
