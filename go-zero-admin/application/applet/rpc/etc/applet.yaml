Name: applet.rpc
Mode: dev
ListenOn: 127.0.0.1:6001
MethodTimeouts:
  - FullMethod: /pb.FileResourceService/UploadFile
    Timeout: 30s
  - FullMethod: /pb.FileResourceService/DeleteFile
    Timeout: 30s
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: applet.rpc
DB:
  DataSource: root:123456@tcp(127.0.0.1:3306)/goZero-admin?parseTime=true&loc=Local
  MaxIdleConns: 10
  MaxOpenConns: 100
  MaxLifetime: 3600
BizRedis:
  Host: 127.0.0.1:6379
  Pass:
  Type: node
JwtAuth:
  AccessSecret: 3fG7-go-zero-admin_p2hE
  AccessExpire: 7200
CasbinConf:
  ModelText: |
    [request_definition]
    r = sub, obj, act
    [policy_definition]
    p = sub, obj, act
    [role_definition]
    g = _, _
    [policy_effect]
    e = some(where (p.eft == allow))
    [matchers]
    m = r.sub == p.sub && keyMatch2(r.obj,p.obj) && r.act == p.act
Default: # 默认值
  UserPassword: GoZero@2026   # 开发环境默认重置密码；生产环境通过环境变量配置
# 存储与 SMTP 凭证只注入业务 RPC。使用根 Compose 时由容器模板生成配置。
Storage:
  Endpoint: http://127.0.0.1:9000
  ExternalEndpoint: http://127.0.0.1:9000
  Region: us-east-1
  AccessKeyID: GOZEROLOCALAPP
  SecretAccessKey: go-zero-local-storage-app-change-me
  PublicBucket: gozero-public
  PrivateBucket: gozero-private
  PresignTTLSeconds: 300
  RequestTimeoutSeconds: 30
Mail:                      # 全部 optional；未配置时 Mail.SendEmailCode 直接报 "邮件服务未配置"
  Host:                    # 例：smtp.example.com
  Port: 465                # 隐式 TLS 端口
  From:                    # 发件人邮箱
  Username:                # SMTP 登录用户名
  Password:                # SMTP 授权码 / 密码
