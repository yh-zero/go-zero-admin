Name: ai-rpc
ListenOn: 0.0.0.0:6004

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

AI:
  Enabled: false                 # 启用 AI 助手需置 true 并配置下方密钥
  Provider: deepseek             # deepseek / qwen
  Model: deepseek-chat
  BaseURL: https://api.deepseek.com/v1
  TimeoutSeconds: 60

  # 模型密钥：在此填入你的 API Key（或经环境变量 API_KEY_DEEPSEEK / API_KEY_QWEN 注入）
  DeepSeekKey:
  QwenKey:
