Name: ai-rpc
ListenOn: 0.0.0.0:6004
Timeout: 120000

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node

AI:
  Enabled: false                 # 启用后通过 API_KEY_<PROVIDER> 环境变量注入密钥
  Provider: deepseek             # deepseek / qwen
  Model: deepseek-chat
  BaseURL: https://api.deepseek.com/v1
  TimeoutSeconds: 60

  # 兼容历史配置字段，保持空值；运行时只读取 API_KEY_DEEPSEEK / API_KEY_QWEN。
  DeepSeekKey:
  QwenKey:
