Name: app-rpc
ListenOn: 0.0.0.0:6002
Timeout: 12000

Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node

JwtAuth:
  AccessSecret: go-zero-app-local-development-secret-change-me
  AccessExpire: 900
  RefreshExpire: 2592000

FileRpc:
  Endpoints:
    - 127.0.0.1:6003
  NonBlock: true

EmailVerificationRequired: true
SMTP:
  Host: smtp.163.com
  Port: 465
  # 凭据：直接填真实值即可生效；保持 ${...} 占位符则从环境变量读取（conf.UseEnv 展开）
  Username: ${APP_SMTP_USERNAME}
  Password: ${APP_SMTP_PASSWORD}
  From: ${APP_SMTP_FROM}
  FromName: 帅浩            # 收件人看到的发件人名称
  ValidSeconds: 600         # 验证码有效10分钟；到期或验证成功后删除
  ImplicitTLS: true

DefaultUserPassword: Demo@123456
