name: gozero-platform

# 平台栈（第 0 号租户）：nginx + api + 5rpc + mysql + redis + rustfs + swagger-ui（迁移在宿主跑 goose）
# 一键启动全部后端：docker compose up -d --build
# 配置双套：容器内服务读 docker/etc/*.yaml（卷挂载，容器网络地址）；
#           宿主 go run 开发读 application/*/etc/*.yaml（127.0.0.1 + 宿主映射端口）。
# 数据卷复用本地既有卷（gozero-new-mysql-data / gozero-integration-rustfs-data），首次为空卷时
# 需按 dev-env.md §2 导入 data/db/backup/ 下最新备份（gozero_platform 库仅靠备份恢复）。

services:
  nginx:
    image: nginx:1.27-alpine
    # restart 与 compose restart 并行重启时可能先于 api 解析域名而退出，靠重启策略自愈
    restart: on-failure
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks: [default, gozero-edge]
    depends_on: [api]

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    ports: ["127.0.0.1:7001:7001"]
    volumes:
      - ./docker/etc/admin-api.yaml:/app/etc/admin.yaml:ro
    # 启动时经 admin-rpc 加载 Casbin 策略，rpc 未就绪会 panic，靠 restart 自愈
    restart: on-failure
    depends_on:
      admin-rpc: { condition: service_started }
      file-rpc: { condition: service_started }

  admin-rpc:
    build: { context: ., dockerfile: docker/Dockerfile, target: admin-rpc }
    volumes:
      - ./docker/etc/admin-rpc.yaml:/app/etc/admin.yaml:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  app-rpc:
    build: { context: ., dockerfile: docker/Dockerfile, target: app-rpc }
    volumes:
      - ./docker/etc/app-rpc.yaml:/app/etc/app.yaml:ro
    environment:
      SMTP_HOST: "${SMTP_HOST:-}"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  file-rpc:
    build: { context: ., dockerfile: docker/Dockerfile, target: file-rpc }
    volumes:
      - ./docker/etc/file-rpc.yaml:/app/etc/file.yaml:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_started }

  ai-rpc:
    build: { context: ., dockerfile: docker/Dockerfile, target: ai-rpc }
    volumes:
      - ./docker/etc/ai-rpc.yaml:/app/etc/ai.yaml:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  tenant-rpc:
    build: { context: ., dockerfile: docker/Dockerfile, target: tenant-rpc }
    volumes:
      - ./docker/etc/tenant-rpc.yaml:/app/etc/tenant.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock   # 仅平台栈；等价宿主 root，注意隔离
      - ./docker/nginx/conf.d:/nginx-conf.d
      - ./docker/tenant-stack:/app/tenant-stack:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  mysql:
    image: mysql:9.7
    container_name: gozero-new-mysql
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"   # 本地开发约定，与各 yaml 声明一致
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gozero_admin}"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 开源开箱即用：空卷时自动导入完整初始化库（已有数据卷不重复执行）
      - ./data/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    container_name: gozero-redis8
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: gozero-integration-rustfs
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-GOZEROLOCALROOT}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-go-zero-local-storage-root-change-me}"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    networks: [default, gozero-edge]   # 平台级共享存储，租户栈按 bucket 隔离

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.0
    volumes:
      - ./data/api/generated:/spec:ro

volumes:
  # 复用本地既有数据卷；卷被删除时自动从 data/db/init 导入完整初始化库
  mysql_data:
    name: gozero-new-mysql-data
  rustfs_data:
    name: gozero-integration-rustfs-data

networks:
  gozero-edge:
    name: gozero-edge