Name: ai-rpc
ListenOn: 0.0.0.0:6004

Mysql:
  DataSource: root:123456@tcp(mysql:3306)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: redis:6379
    Type: node

AI:
  Enabled: false                 # 启用 AI 助手需置 true 并配置下方密钥
  Provider: deepseek             # deepseek / qwen
  Model: deepseek-chat
  BaseURL: https://api.deepseek.com/v1
  TimeoutSeconds: 60

  # 模型密钥：在此填入你的 API Key（注意：环境变量注入尚未实现，见 dev-env.md）
  DeepSeekKey:
  QwenKey:
