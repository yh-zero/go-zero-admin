Name: ai-rpc
ListenOn: 0.0.0.0:6004
Timeout: 120000

Mysql:
  DataSource: root:123456@tcp(mysql:3306)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: redis:6379
    Type: node

AI:
  Enabled: false                 # 兼容旧开关；实际按 AI_<PROVIDER>_KEY 是否有值启停
  Provider: deepseek             # deepseek / qwen
  Model: deepseek-chat
  BaseURL: https://api.deepseek.com/v1
  TimeoutSeconds: 60

  # 兼容历史配置字段，保持空值；运行时只读取 AI_DEEPSEEK_KEY / AI_QWEN_KEY。
  DeepSeekKey:
  QwenKey:
