Name: admin-api
Host: 0.0.0.0
Port: 7001

AdminRpc:
  Endpoints:
    - admin-rpc:6001

FileRpc:
  Endpoints:
    - file-rpc:6003

Redis:
  Host: redis:6379
  Type: node

TenantRpc:
  Endpoints:
    - tenant-rpc:6005
  Timeout: 120000

AppRpc:
  Endpoints:
    - app-rpc:6002
  NonBlock: true
  Timeout: 15000

AiRpc:
  Endpoints:
    - ai-rpc:6004
  NonBlock: true
  Timeout: 120000

Auth:
  AccessSecret: go-zero-admin-local-development-jwt-secret
  AccessExpire: 7200
