Name: admin-api
Host: 0.0.0.0
Port: 7001

AdminRpc:
  Endpoints:
    - admin-rpc:6001

FileRpc:
  Endpoints:
    - file-rpc:6003
  Timeout: 40000

# 与 Compose 中固定的 Nginx default 网络地址保持一致，只信任该代理。
TrustedProxies:
  - "${GOZERO_PLATFORM_PROXY_IP}/32"

Redis:
  Host: redis:6379
  Type: node

TenantRpc:
  Endpoints:
    - tenant-rpc:6005
  Timeout: 120000

AppRpc:
  Endpoints:
    - app-rpc:6002
  NonBlock: true
  Timeout: 15000

AiRpc:
  Endpoints:
    - ai-rpc:6004
  NonBlock: true
  Timeout: 120000

Auth:
  AccessSecret: go-zero-admin-local-development-jwt-secret
  AccessExpire: 7200
