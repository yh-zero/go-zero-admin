Name: admin-rpc
ListenOn: 0.0.0.0:6001

FileRpc:
  Endpoints:
    - file-rpc:6003
  NonBlock: true
  Timeout: 1500

Mysql:
  DataSource: root:123456@tcp(mysql:3306)/gozero_admin?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai

CacheRedis:
  - Host: redis:6379
    Type: node

JwtAuth:
  AccessSecret: go-zero-admin-local-development-jwt-secret
  AccessExpire: 7200

Captcha:
  Enabled: true # 登录是否需要图片验证码
  ExpireSeconds: 120

DefaultUserPassword: Admin@123456
