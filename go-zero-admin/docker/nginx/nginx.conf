user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # 10 MiB 文件经过 Base64 后约 13.34 MiB，与 API 上传路由的 14 MiB 上限一致。
    client_max_body_size 14m;
    # 租户生命周期与 AI API 最长等待 120 秒，代理须保留完整响应窗口。
    proxy_read_timeout 125s;

    # 未登记或已停用的租户域名不能回落到平台接口。
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    # 平台管理台（第 0 号租户）
    server {
        listen 80;
        server_name platform.localhost localhost;
        location / {
            proxy_pass http://platform-api:7001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 租户 server 块由 tenant-rpc 生成到 conf.d/（卷挂载共享）
    include /etc/nginx/conf.d/*.conf;
}
