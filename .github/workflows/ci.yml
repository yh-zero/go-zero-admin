name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端自检
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      # 保持 go.mod/go.sum 为 LF，避免 tidy -diff 将检出换行误判为依赖变更。
      - name: 保持检出文件换行
        run: git config --global core.autocrlf false

      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 安装项目指定的 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-zero-admin/go.mod
          cache-dependency-path: go-zero-admin/go.sum

      - name: 安装 goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.2

      - name: 安装评测脚本使用的 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: go-zero-admin-react/package.json
          package-manager-cache: false

      - name: 运行后端七项自检
        working-directory: go-zero-admin
        run: ./data/scripts/verify.ps1

      - name: 运行后端 Go 包检查与脚本回归
        working-directory: go-zero-admin
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw '后端 Go 包检查失败' }
          ./test/verify_script_test.ps1
          ./test/verify_network_script_test.ps1
          if ($LASTEXITCODE -ne 0) { throw '代理网络配置回归失败' }

      - name: 运行知识库与评测工具回归
        working-directory: .
        run: |
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          $regressionFiles = @(Get-ChildItem -LiteralPath go-zero-admin/data/scripts -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object FullName)
          if ($regressionFiles.Count -eq 0) { throw '没有发现脚本回归，不得静默跳过' }
          node --test --test-concurrency=2 @regressionFiles
          if ($LASTEXITCODE -ne 0) { throw '知识库与评测脚本回归失败' }

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 安装项目指定的 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: go-zero-admin-react/package.json
          package-manager-cache: false

      - name: 安装项目指定的 pnpm
        working-directory: go-zero-admin-react
        run: |
          ci_package_manager="$(node -p "require('./package.json').packageManager")"
          npm install --global --prefix "$RUNNER_TEMP/ci-pnpm" "$ci_package_manager"
          echo "$RUNNER_TEMP/ci-pnpm/bin" >> "$GITHUB_PATH"

      - name: 按锁文件安装依赖
        working-directory: go-zero-admin-react
        run: pnpm install --frozen-lockfile

      - name: 检查 TypeScript 类型
        working-directory: go-zero-admin-react
        run: pnpm exec tsc -b

      - name: 检查前端代码规范
        working-directory: go-zero-admin-react
        run: pnpm lint

      - name: 运行前端行为回归
        working-directory: go-zero-admin-react
        run: node --test --test-concurrency=2 scripts/*.test.mjs

      - name: 构建前端
        working-directory: go-zero-admin-react
        run: pnpm exec vite build
